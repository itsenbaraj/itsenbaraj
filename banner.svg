<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', ui-monospace, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Container Box -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="50" r="90" fill="#0ea5e9" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="160" r="110" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Bottom Wave Ribbon -->
  <path d="M0,175 C200,140 450,210 650,165 C780,135 850,180 900,160 L900,220 L0,220 Z" fill="url(#waveGrad)" />

  <!-- Top Status Pill -->
  <g transform="translate(50, 32)">
    <rect width="265" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" opacity="0.9" />
    <circle cx="14" cy="13" r="4.5" fill="#10b981" />
    <text x="26" y="17" class="badge-text">FULL STACK &amp; TECH LEAD</text>
  </g>

  <!-- Main Headline -->
  <text x="50" y="105" class="title">Hi there, I'm Enbaraj Roovechandar 👋</text>

  <!-- Subtitle -->
  <text x="50" y="142" class="subtitle">Python • Django • React.js • MySQL • High-Performance Web Architecture</text>

  <!-- Right Accent Badges -->
  <g transform="translate(640, 32)">
    <rect width="210" height="28" rx="8" fill="#1e1b4b" stroke="#4338ca" stroke-width="1" />
    <text x="14" y="18" class="pill-text">⭐ 2x Employee of the Month</text>
  </g>
</svg>
